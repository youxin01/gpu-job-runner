name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n get_free_gpus.sh gpu_job_runner.sh gpu_job_runner_task.sh
      - run: python -m py_compile get_free_gpus.py gpu_job_runner_parse.py
